recollections:

  - company: QuotaPath
    role_context: Solutions Engineer / Data Platform Architect
    narrative: >
      QuotaPath is a commission automation platform. I worked directly with
      customers to integrate their source systems with the platform — typically
      CRM platforms (Salesforce, HubSpot, etc.) and ERP or financial platforms
      (Stripe, Sage Intacct, etc.). We had dedicated customer pools and
      supported customers from onboarding and on an ongoing basis.
      That meant supporting their payouts process and cadences as they used our
      platform to run payouts, especially when using our integration with
      Rippling. I helped scope out source systems as well as the actual data
      involved, so we could map their data fields and any custom business logic
      into the platform. Often custom logic was required for integrations:
      individual custom calculations or full transformation scripts written in
      Python and run within our CI/CD pipeline via GitHub.
    themes_for_stories:
      - Customer-facing integration scoping and delivery
      - CRM + ERP/financial data mapping and custom logic
      - Payouts, Rippling, and ongoing support cadences
      - Python transforms and CI/CD (GitHub) for production integrations
      - Dedicated customer pools and handoffs (Account AI, documentation)
    clarifying_questions_to_expect:
      - "How did you prioritize across 300+ concurrent implementations?"
      - "Describe a complex integration you scoped and delivered."
      - "How did you handle custom business logic vs. out-of-the-box features?"
      - "What did handoffs look like before and after Account AI?"

